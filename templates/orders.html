{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3">
    <h2>🧾 Orders</h2>
    <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addModal">+ New Order</button>
</div>

<div class="card">
    <div class="table-responsive">
        <table class="table table-bordered table-hover mb-0">
            <thead class="table-dark">
                <tr><th>ID</th><th>Customer</th><th>Phone</th><th>Amount</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody>
                {% for o in orders %}
                <tr>
                    <td>#{{ o.order_id }}</td>
                    <td>{{ o.customer_name }}</td>
                    <td>{{ o.phone }}</td>
                    <td>Rs. {{ o.final_amount }}</td>
                    <td>
                        <span class="badge bg-{% if o.status=='Delivered' %}success{% elif o.status=='Pending' %}warning{% elif o.status=='Cancelled' %}danger{% else %}info{% endif %}">
                            {{ o.status }}
                        </span>
                    </td>
                    <td>
                        <a href="/orders/status/{{ o.order_id }}/Ready" class="btn btn-sm btn-info">Ready</a>
                        <a href="/orders/status/{{ o.order_id }}/Delivered" class="btn btn-sm btn-success">✓</a>
                        <a href="/orders/status/{{ o.order_id }}/Cancelled" class="btn btn-sm btn-danger">✗</a>
                        <a href="/orders/delete/{{ o.order_id }}" class="btn btn-sm btn-dark" onclick="return confirm('Delete this order?')">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="addModal">
    <div class="modal-dialog">
        <div class="modal-content">
            <form method="POST" action="/orders/add">
                <div class="modal-header"><h5>New Order</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-2">
                        <label>Customer*</label>
                        <select name="customer_id" class="form-select" required>
                            <option value="">--</option>
                            {% for c in customers %}
                            <option value="{{ c.customer_id }}">{{ c.full_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-2">
                        <label>Product*</label>
                        <select name="product_id" class="form-select" required>
                            <option value="">--</option>
                            {% for p in products %}
                            <option value="{{ p.product_id }}">{{ p.product_name }} (Rs. {{ p.price }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-2"><label>Quantity*</label><input name="quantity" type="number" value="1" min="1" class="form-control" required></div>
                    <div class="mb-2"><label>Delivery Date</label><input name="delivery_date" type="date" class="form-control"></div>
                </div>
                <div class="modal-footer"><button class="btn btn-dark">Place Order</button></div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
